services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5433"
    command: -p 5433
    labels:
      org.springframework.boot.ignore: "true"

  payment-stub:
    image: payment-stub:latest
    build:
      context: ..
      dockerfile: payment-stub/Dockerfile
    environment:
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
